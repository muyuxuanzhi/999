<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>极限逃脱 999 · 序幕新手关（试玩）</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- 标题画面 / 主界面 -->
<div id="screen-title" class="screen active">
  <div class="title-box">
    <h1>怪谈笔记 999</h1>
    <h2>序幕 · 入职</h2>
    <p class="title-tip">（占位版 · 文字 + 色块道具 · 约 20 分钟）</p>
    <div class="menu-buttons">
      <button id="btn-start">新游戏</button>
      <button id="btn-continue">继续</button>
      <button id="btn-load-menu">存档管理</button>
      <button id="btn-flowchart-menu">剧情流程图</button>
    </div>
  </div>
</div>

<!-- 游戏主画面：左 = 房间全局模型（three.js），右 = 4:3 游玩界面 + 4:1 对话框 -->
<div id="screen-game" class="screen">

  <!-- 左：房间全局模型 -->
  <div id="room-panel">
    <div id="room3d"></div>
    <div id="room-caption"></div>
    <div id="room-hint">拖动旋转 · 滚轮缩放 · 双击复位</div>
  </div>

  <!-- 右：游玩区 -->
  <div id="play-panel">

    <!-- 顶部状态条 -->
    <div id="topbar">
      <div id="room-name">序幕 · 单人关押室</div>
      <button id="btn-system" style="display:none;">☎ 总机</button>
      <div id="countdown">倒计时 <span id="countdown-time">19:37</span></div>
    </div>

    <!-- 场景舞台（4:3） -->
    <div id="stage" class="stage-dark">
      <div id="stage-label"></div>
      <div id="hotspots"></div>
    </div>

    <!-- 对话 / 旁白框（4:1，紧贴舞台下方） -->
    <div id="dialogue-box">
      <div id="dlg-speaker"></div>
      <div id="dlg-text"></div>
      <div id="dlg-next">▼ 点击继续</div>
    </div>

    <!-- 物品栏 -->
    <div id="inventory"></div>

  </div>

</div>

<!-- 时钟解谜弹窗 -->
<div id="screen-clock" class="screen">
  <div class="modal-box">
    <h3>门旁 · 可拨动的时钟</h3>
    <div class="clock-face">
      <div id="clock-display">--:--</div>
    </div>
    <div class="clock-controls">
      <div class="clock-col">
        <div class="clock-label">时</div>
        <button data-adj="hour" data-dir="1">▲</button>
        <div id="clock-hour">02</div>
        <button data-adj="hour" data-dir="-1">▼</button>
      </div>
      <div class="clock-col">
        <div class="clock-label">分</div>
        <button data-adj="min" data-dir="1">▲</button>
        <div id="clock-min">14</div>
        <button data-adj="min" data-dir="-1">▼</button>
      </div>
    </div>
    <div id="clock-hint"></div>
    <div class="modal-buttons">
      <button id="btn-clock-confirm">拨动到此位置</button>
      <button id="btn-clock-close">离开</button>
    </div>
  </div>
</div>

<!-- 选门弹窗 -->
<div id="screen-doors" class="screen">
  <div class="modal-box">
    <h3>请选择你要进入的【工作间】</h3>
    <div class="door-list">
      <button class="door-btn" data-door="tea">茶水间（闸 · 舌）<span class="deposit-tag deposit-full">已集齐</span></button>
      <button class="door-btn" data-door="server">机房（闸 · 耳）<span class="deposit-tag deposit-full">已集齐</span></button>
      <button class="door-btn" data-door="dark">黑暗房（闸 · 眼）<span class="deposit-tag deposit-short">缺一份</span></button>
    </div>
  </div>
</div>

<!-- 水渍立绘弹窗：首次看清自己的脸 -->
<div id="screen-portrait" class="screen">
  <div class="modal-box portrait-box">
    <h3>水渍 · 倒影</h3>
    <div class="portrait-frame">
      <div class="portrait-placeholder" id="portrait-img">橘鏡</div>
    </div>
    <p class="portrait-caption">从这一刻起，可以保存进度，也能查看故事的分支流程图。</p>
    <div class="modal-buttons">
      <button id="btn-portrait-save">保存进度</button>
      <button id="btn-portrait-flowchart">查看流程图</button>
      <button id="btn-portrait-close">继续探索</button>
    </div>
  </div>
</div>

<!-- 总机菜单：游戏内系统入口 -->
<div id="screen-sysmenu" class="screen">
  <div class="modal-box">
    <h3>☎ 总机</h3>
    <div class="menu-buttons">
      <button id="btn-sys-save">保存进度</button>
      <button id="btn-sys-load">读取存档</button>
      <button id="btn-sys-flowchart">剧情流程图</button>
      <button id="btn-sys-title">返回主界面</button>
      <button id="btn-sys-close">关闭</button>
    </div>
  </div>
</div>

<!-- 存档 / 读档界面 -->
<div id="screen-saves" class="screen">
  <div class="modal-box saves-box">
    <h3 id="saves-title">存档</h3>
    <div id="saves-grid" class="saves-grid"></div>
    <div class="modal-buttons">
      <button id="btn-saves-back">返回</button>
    </div>
  </div>
</div>

<!-- 剧情流程图 -->
<div id="screen-flowchart" class="screen">
  <div class="modal-box flowchart-box">
    <h3>故事流程图</h3>
    <div id="flowchart-body" class="flowchart-body"></div>
    <div class="modal-buttons">
      <button id="btn-flowchart-back">返回</button>
    </div>
  </div>
</div>

<!-- 结局画面 -->
<div id="screen-end" class="screen">
  <div class="title-box">
    <h1>序幕 · 结束</h1>
    <p id="end-text"></p>
    <p id="end-lock-notice" style="display:none; color:#e8a33b;">【剧情锁已解锁】通关档案室里，多了一行新的记录……</p>
    <div class="menu-buttons">
      <button id="btn-restart">重新开始</button>
      <button id="btn-end-flowchart" style="display:none;">查看流程图</button>
      <button id="btn-end-title">返回主界面</button>
    </div>
  </div>
</div>

<script src="game.js"></script>
<script type="module">
  import "./room3d.js";
  const el = document.getElementById("room3d");
  try {
    window.Room3D.init(el);
    window.__room3dReady = true;
    window.dispatchEvent(new Event("room3d-init"));
  } catch (e) {
    el.innerHTML = '<div class="room-fallback">当前环境不支持 3D 预览（WebGL 不可用）</div>';
    console.warn("Room3D init failed:", e);
  }
</script>
</body>
</html>
